[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "termicode"
version = "0.1.3"
description = "Interactive terminal AI coding assistant with secure file editing and OpenRouter-backed model access"
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "Parth Pathak"}
]
keywords = ["ai", "coding-assistant", "openrouter", "terminal", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
    "ddgs>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
]
# Optional engine behind /heal, /report, /guard. TermiCode runs fully without it.
repowise = [
    "repowise>=0.28.0",
]

[project.scripts]
termicode = "termicode.cli:main"
termicode-guard-check = "termicode.guard_check:main"

[project.urls]
Homepage = "https://github.com/parthpathakpp29/termicode"
Repository = "https://github.com/parthpathakpp29/termicode"
Issues = "https://github.com/parthpathakpp29/termicode/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["termicode*"]

[tool.setuptools.package-data]
termicode = ["*.md"]
